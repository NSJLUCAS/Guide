<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The same mark the public page carries, two chevrons pointing ahead.
       The leading one flips with the system theme, since a favicon sits on
       browser chrome neither page picks. -->
  <style>
    .lead { stroke: #2b2b2b }
    @media (prefers-color-scheme: dark) { .lead { stroke: #e5e5e5 } }
  </style>
  <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 14 L30 32 L12 50" stroke="#9a9a9a"/>
    <path class="lead" d="M32 14 L50 32 L32 50"/>
  </g>
</svg>
