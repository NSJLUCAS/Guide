name: Guide CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guide-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: guide
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            guide/web-admin/package-lock.json
            navigation-theme/package-lock.json
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: guide -> target
          shared-key: guide-linux-x86_64
      - name: Admin lint, tests and production build
        working-directory: guide/web-admin
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Navigation lint, tests and production build
        working-directory: navigation-theme
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Rust formatting
        run: cargo fmt --all --check
      # Full suite includes migrations and Auth; no test filters or skips.
      - name: Full Rust tests
        run: cargo test --locked
      - name: Linux release build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
